# Builds the Windows portable .exe on a GitHub-hosted Windows machine and attaches it to a release.
#   - push a tag like v0.2.0  -> builds and creates/updates that release
#   - Actions tab > "Windows release" > Run workflow, typing an existing tag (e.g. v0.1.0) -> builds and adds the exe to it
# Lint and unit tests run first (on Linux; the app test needs a display and is run locally).
name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the exe to (must already exist), e.g. v0.1.0'
        required: true

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm test

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # builds the portable exe and verifies that the bundled ffmpeg really is a Windows binary
      - run: npm run dist:win
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/SOTH-Cam-Control-portable.exe --clobber
